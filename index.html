  $('#app').innerHTML=`<section class="panel"><div class="row"><h2>Corte del día</h2><input id="dateCut" type="date" value="${date}"></div><div class="grid"><div class="stat">Ventas<b>${M(sales)}</b></div><div class="stat">Total cobrado hoy<b>${M(paid+a)}</b></div><div class="stat">Abonos<b>${M(a)}</b></div><div class="stat">Pendiente<b>${M(pending)}</b></div><div class="stat">Tortillas kg<b>${kg.toFixed(2)}</b></div></div></section>
  <section class="panel"><h2>Detalle por cliente</h2><p class="muted small">Toca el nombre del cliente en la tabla para modificar kilos, extras o el pago. Si no cambias el pago, se conserva.</p><div id="cutClientList"><table><thead><tr><th>Cliente</th><th class="right">Kg</th><th class="right">Precio</th><th class="right">Total</th><th class="pay-col">Pago</th></tr></thead><tbody>${listed.map(({client:c,record:r})=>`<tr><td><button data-edit-sale="${E(c.id)}" style="padding:5px 7px;min-height:34px;text-align:left;border:0;background:transparent;color:var(--g);text-decoration:underline">${E(c.name)}</button></td><td class="right">${r?N(r.kg).toFixed(2):'0.00'}</td><td class="right">${M(r?(r.price??c.price):c.price)}</td><td class="right">${M(r?total(r):0)}</td><td class="pay-col"><span class="pay-mark ${r?.status==='paid'?'is-paid':r?.status==='unpaid'?'is-unpaid':'is-none'}" title="${r?.status==='paid'?'Pagó':r?.status==='unpaid'?'No pagó':'Sin venta'}" aria-label="${r?.status==='paid'?'Pagó':r?.status==='unpaid'?'No pagó':'Sin venta'}">${r?.status==='paid'?'✓':r?.status==='unpaid'?'✕':'—'}</span></td></tr>`).join('')||'<tr><td colspan="5">No hay clientes registrados.</td></tr>'}</tbody></table></div>
  <div id="modifyPanel" class="panel hide"><h3 id="modifyTitle">Modificar venta</h3><label>Kilos de tortillas</label><input id="modKg" type="number" min="0" step=".01"><div class="row"><b>Extras</b><button id="modAddExtra" style="flex:0 0 auto">＋ Agregar extra</button></div><div id="modExtras"></div><div class="stat">Total de venta<b id="modTotal">$0.00</b></div><label>Estado del pago (opcional)</label><select id="modStatus"><option value="keep">Conservar el estado anterior</option><option value="paid">SÍ PAGÓ</option><option value="unpaid">NO PAGÓ</option></select><p id="modStatusHint" class="muted small"></p><button class="primary wide" id="saveModified">Guardar cambios</button><button class="wide" id="cancelModify">Cancelar</button></div></section>
  <section class="panel"><h2>Resumen semanal</h2><p class="muted">${start} al ${end} (domingo a sábado)</p><div class="grid"><div class="stat">Ventas<b>${M(week.reduce((s,r)=>s+total(r),0))}</b></div><div class="stat">Kg<b>${week.reduce((s,r)=>s+N(r.kg),0).toFixed(2)}</b></div></div></section>
  <section class="panel cleanup"><h2>Limpieza del historial</h2><p class="muted">Se eliminan ventas pagadas y días sin entrega. Se conservan clientes, saldos y ventas pendientes.</p><label>Desde</label><input id="from" type="date" value="${start}"><label>Hasta</label><input id="to" type="date" value="${end}"><button class="wide" id="period">Limpiar periodo</button><button class="wide danger" id="all">Limpiar todo el historial pagado</button></section><button class="primary wide" id="backup">Descargar respaldo</button><button class="wide" id="restoreBtn">Restaurar respaldo</button><input id="file" type="file" accept="application/json" class="hide">`;
  let modId=null,modExtras=[];
  function drawExtras(target,arr,prefix,changed){let h=$(target);h.innerHTML=arr.map((x,i)=>`<div class="extra"><div><label>Concepto</label><select data-${prefix}="${i}" data-f="type"><option ${x.type==='Masa'?'selected':''}>Masa</option><option ${x.type==='Totopos'?'selected':''}>Totopos</option><option ${x.type==='Desperdicio'?'selected':''}>Desperdicio</option><option ${ab(x)?'selected':''}>Abono a adeudo</option></select></div><div><label>${ab(x)?'Importe':'Cantidad'}</label><input data-${prefix}="${i}" data-f="${ab(x)?'price':'qty'}" type="number" min="0" step=".01" value="${ab(x)?x.price??'':x.qty??''}"></div><div><label>${ab(x)?'—':'Precio'}</label>${ab(x)?'Importe único':`<input data-${prefix}="${i}" data-f="price" type="number" min="0" step=".01" value="${x.price??''}">`}</div><button data-${prefix}-del="${i}">×</button></div>`).join('')||'<p class="muted">Sin extras.</p>';h.querySelectorAll(`[data-${prefix}]`).forEach(el=>el.onchange=el.oninput=()=>{let i=+el.dataset[prefix],f=el.dataset.f;if(f==='type'){arr[i]={type:el.value,qty:1,price:0};drawExtras(target,arr,prefix,changed)}else arr[i][f]=N(el.value);changed()});h.querySelectorAll(`[data-${prefix}-del]`).forEach(b=>b.onclick=()=>{arr.splice(+b.dataset[prefix+'Del'],1);drawExtras(target,arr,prefix,changed);changed()})}
  function modTotals(){let r=get(date,modId),c=db.clients.find(x=>x.id===modId);$('#modTotal').textContent=M(N($('#modKg').value)*N(r?.price??c?.price)+exs(modExtras))}
  function openModify(id){let c=db.clients.find(x=>x.id===id),r=get(date,id);if(!c)return;modId=id;modExtras=JSON.parse(JSON.stringify(r?.extras||[]));$('#modifyTitle').textContent='Modificar: '+c.name;$('#modKg').value=N(r?.kg);$('#modStatus').value='keep';$('#modStatusHint').textContent=r?.status==='paid'?'Estado actual: SÍ PAGÓ':r?.status==='unpaid'?'Estado actual: NO PAGÓ':'Sin venta registrada: elige SÍ PAGÓ o NO PAGÓ al guardar una venta';$('#modifyPanel').classList.remove('hide');drawExtras('#modExtras',modExtras,'mx',modTotals);modTotals();$('#modifyPanel').scrollIntoView({behavior:'smooth',block:'start'})}
  $('#cutClientList').querySelectorAll('[data-edit-sale]').forEach(b=>b.onclick=()=>openModify(b.dataset.editSale));$('#modKg').oninput=modTotals;$('#modAddExtra').onclick=()=>{modExtras.push({type:'Masa',qty:1,price:0});drawExtras('#modExtras',modExtras,'mx',modTotals);modTotals()};$('#cancelModify').onclick=()=>$('#modifyPanel').classList.add('hide');$('#saveModified').onclick=()=>{if(!modId)return;let r=get(date,modId),c=db.clients.find(x=>x.id===modId),choice=$('#modStatus').value,status=choice==='keep'?(r?.status||'none'):choice,kg=N($('#modKg').value),hasSale=kg>0||exs(modExtras)>0;if(status!=='paid'&&status!=='unpaid'&&hasSale)return alert('Este cliente no tenía venta. Selecciona SÍ PAGÓ o NO PAGÓ para registrar la venta.');if(!r&&!hasSale&&!abs(modExtras)&&choice==='keep')return alert('No hay cambios para guardar.');applySale(modId,kg,modExtras,status,r?.price??c.price);alert('Cambios guardados. '+(choice==='keep'?'Se conservó el estado anterior.':'Se actualizó el estado de pago.'));cut()};
  $('#dateCut').onchange=e=>{db.date=e.target.value||today();save();cut()};$('#period').onclick=()=>{let x=$('#from').value,y=$('#to').value;if(!x||!y||x>y)return alert('Revisa las fechas');if(confirm('Se borrarán ventas pagadas de este periodo. Se conservan saldos y pendientes. ¿Continuar?')){clean(x,y);cut()}};$('#all').onclick=()=>{if(confirm('¿Borrar todo el historial pagado? Se conservan clientes, saldos y ventas pendientes.')){clean('0000-01-01','9999-12-31');cut()}};$('#backup').onclick=backup;$('#restoreBtn').onclick=()=>$('#file').click();$('#file').onchange=restore;
}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='control-ruta-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restore(){let f=$('#file').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.clients)||!x.records)throw 0;if(!confirm('Esto reemplazará los datos de este teléfono. ¿Continuar?'))return;db=x;db.payments||=[];save();render();alert('Respaldo restaurado')}catch(e){alert('Respaldo no válido')}};rd.readAsText(f)}
function debts(){$('#app').innerHTML=`<section class="panel"><h2>Adeudos</h2><div class="stat">Saldo pendiente total<b>${M(db.clients.reduce((s,c)=>s+bal(c.id),0))}</b></div></section><section class="panel"><h2>Registrar abono</h2><label>Cliente</label><select id="who">${db.clients.map(c=>`<option value="${E(c.id)}">${E(c.name)}</option>`).join('')}</select><label>Importe recibido ($)</label><input id="amount" type="number" min=".01" step=".01"><label>Nota</label><input id="note" placeholder="Abono o liquidación"><button class="primary wide" id="register">Registrar pago</button></section><section class="panel"><h2>Saldos por cliente</h2>${db.clients.map(c=>`<div class="row"><span>${E(c.name)}</span><b class="right">${M(bal(c.id))}</b></div>`).join('')}</section><section class="panel"><h2>Historial de abonos</h2>${db.payments.slice().reverse().map(p=>`<div class="row small"><span>${E(p.clientName)}<div class="muted">${E(p.date)} ${E(p.note||'')}</div></span><b>${M(p.amount)}</b></div>`).join('')||'<p class="muted">Sin abonos registrados.</p>'}</section><section class="panel cleanup"><h2>Reiniciar adeudos guardados</h2><p class="muted">Pone en cero todos los saldos. No elimina clientes ni ventas.</p><button class="danger wide" id="clear">Borrar todos los adeudos</button></section><button class="wide" id="backup">Descargar respaldo</button>`;$('#register').onclick=()=>{let c=db.clients.find(x=>x.id===$('#who').value),v=N($('#amount').value);if(!c||!v)return alert('Indica cliente e importe');if(v>bal(c.id)&&!confirm('El pago supera el adeudo. ¿Continuar?'))return;c.balance=Math.max(0,bal(c.id)-v);db.payments.push({clientId:c.id,clientName:c.name,amount:v,date:today(),note:$('#note').value});save();debts()};$('#clear').onclick=()=>{if(confirm('¿Poner todos los adeudos en cero?')){db.clients.forEach(c=>c.balance=0);save();debts()}};$('#backup').onclick=backup}
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></main></body></html>
